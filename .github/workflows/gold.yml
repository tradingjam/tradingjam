name: Test scalpingu złota

on:
  workflow_dispatch:
    inputs:
      sym:
        description: 'Para z Binance (np. PAXGUSDT)'
        default: 'PAXGUSDT'
      mode:
        description: 'scalp (1m/5m) albo swing (1h/4h/1d)'
        default: 'swing'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test na historii
        env:
          SYM: ${{ inputs.sym }}
          GOLD_MODE: ${{ inputs.mode }}
        run: node scripts/backtest-gold.js
