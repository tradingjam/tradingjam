name: Backtest TOP 10

on:
  workflow_dispatch:
    inputs:
      iv:
        description: 'Horyzont: 1h (24 godz.), 4h (3 dni), 1d (14 dni), 30d (30 dni)'
        default: '1h'
      mode:
        description: 'Układ: big (2:1), equal (1:1), equal15 (1:1 bliżej), safe (1:2), auto (model sam wybiera), exits (sposoby zamykania)'
        default: 'big'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backtest
        env:
          IV: ${{ github.event.inputs.iv }}
          MODE: ${{ github.event.inputs.mode }}
          VALID_N: ${{ github.event.inputs.mode == 'fh' && '2000' || '1000' }}
        run: node scripts/backtest-top.js
