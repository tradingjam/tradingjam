name: Test wykresu na Telegram
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund --prefix bot @resvg/resvg-js@2.6.2
      - name: Wyślij przykładowy wykres (BTC z BingX)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node -e "
          const X=require('./app/exchanges.js');const {chartSVG,renderPng}=require('./bot/chart.js');
          (async()=>{const k=await X.bingxKlines('BTC-USDT','1h',120);const last=k.c[k.c.length-1];
          const png=renderPng(chartSVG(k,{base:'BTC',side:'LONG',status:'przykład wykresu (test)',sub:'tak będą wyglądać zrzuty konta I przed wejściem',lvl:Math.max(k.h[k.h.length-2],k.h[k.h.length-3]),stop:last*0.98,target:last*1.04,checks:'test: nie nóż ✓  RSI ✓  EMA20 ✓  wolumen ✓  trend 4h ✓'}));
          if(!png){console.log('brak PNG');process.exit(1)}
          const fd=new FormData();fd.append('chat_id',process.env.TELEGRAM_CHAT_ID);fd.append('caption','📊 Test: tak konto I pokaże wykres przed wejściem w pozycję');fd.append('photo',new Blob([png],{type:'image/png'}),'wykres.png');
          const r=await fetch('https://api.telegram.org/bot'+process.env.TELEGRAM_TOKEN+'/sendPhoto',{method:'POST',body:fd});console.log('HTTP',r.status);if(!r.ok)process.exit(1)})()"
